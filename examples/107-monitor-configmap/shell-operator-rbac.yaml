---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-configmap-acc

---
# The hook monitors ConfigMaps in one namespace, so a namespaced Role is enough.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor-configmap
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor-configmap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitor-configmap
subjects:
  - kind: ServiceAccount
    name: monitor-configmap-acc
    namespace: example-monitor-configmap
