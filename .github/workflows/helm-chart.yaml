# Lint, unit test and install the Helm chart.
# Start for pull requests that touch the chart.
name: Helm chart
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "charts/**"
      - ".github/workflows/helm-chart.yaml"
permissions:
  contents: read
jobs:
  lint_and_test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out shell-operator code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0
      - name: ct lint
        run: ct lint --chart-dirs charts --target-branch ${{ github.event.repository.default_branch }} --validate-maintainers=false
      - name: helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1
          helm unittest charts/shell-operator
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for values in charts/shell-operator/ci/*.yaml; do
            helm template ci charts/shell-operator -f "$values" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: README is up to date
        run: |
          curl -sSL https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz | tar xz helm-docs
          ./helm-docs --chart-search-root charts
          git diff --exit-code -- charts
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
      - name: ct install
        run: ct install --chart-dirs charts --target-branch ${{ github.event.repository.default_branch }}
